apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: stock-cert
spec:
  secretName: stock-tls-secret
  issuerRef:
    name: letsencrypt-stage
    kind: ClusterIssuer
  commonName: DNSNAME
  dnsNames:
  - DNSNAME
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-stock-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: router-showroom-secret-reader
subjects:
- kind: ServiceAccount
  name: router
  namespace: openshift-ingress  