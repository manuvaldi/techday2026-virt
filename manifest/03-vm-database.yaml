---
kind: Secret
apiVersion: v1
metadata:
  name: cloud-init-database
stringData:
  userdata: |
    #cloud-config
    system_info:
      default_user:
        name: fedora
        plain_text_passwd: fedora
        lock_passwd: false
        sudo: ALL=(ALL) NOPASSWD:ALL
    package_update: false
    package_upgrade: false
    packages:
      # - httpd
      - nano
    write_files:
      - path: /etc/containers/systemd/database.container
        content: |
          [Unit]
          Description=database
          StartLimitIntervalSec=0
          [Container]
          Image=quay.io/mvalledi/stock-example-app-database:latest
          ContainerName=database
          PublishPort=6379:6379
          #Pull=Always
          [Service]
          Restart=always
          RestartSec=5s
          TimeoutStartSec=10
          [Install]
          WantedBy=multi-user.target default.target
    runcmd:
      - setenforce 0
      - sed -i 's/^SELINUX=.*/SELINUX=disabled/' /etc/selinux/config
      - systemctl daemon-reload
      - systemctl start database
      - systemctl enable --now database
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  labels:
    app: database
    kubevirt.io/dynamic-credentials-support: 'true'
    vm.kubevirt.io/template: fedora-server-small
    vm.kubevirt.io/template.namespace: openshift
    vm.kubevirt.io/template.revision: '1'
    vm.kubevirt.io/template.version: v0.34.1
  name: database
spec:
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        creationTimestamp: null
        name: database
      spec:
        source:
            registry:
              url: "docker://quay.io/containerdisks/fedora:43"
        storage:
          resources:
            requests:
              storage: 5Gi
  runStrategy: RerunOnFailure
  template:
    metadata:
      annotations:
        vm.kubevirt.io/flavor: small
        vm.kubevirt.io/os: fedora
        vm.kubevirt.io/workload: server
      creationTimestamp: null
      labels:
        kubevirt.io/domain: database
        kubevirt.io/size: small
    spec:
      architecture: amd64
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - masquerade: {}
              model: virtio
              name: default
          rng: {}
        features:
          acpi: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        machine:
          type: pc-q35-rhel9.6.0
        memory:
          guest: 2Gi
        resources: {}
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 180
      volumes:
        - dataVolume:
            name: database
          name: rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: cloud-init-database              
---
apiVersion: v1
kind: Service
metadata:
  name: database
spec:
  selector:
    kubevirt.io/domain: database
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
